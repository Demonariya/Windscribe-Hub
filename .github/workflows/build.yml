name: Build Windows EXE
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Generate app icon
        run: python tools/make_icon.py
      - name: Build executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WindscribePro --icon assets/WindscribeHub.ico --add-data "assets/WindscribeHub.ico;assets" WindscribeHub.py
      - uses: actions/upload-artifact@v4
        with:
          name: WindscribePro-Windows
          path: dist/WindscribePro.exe
